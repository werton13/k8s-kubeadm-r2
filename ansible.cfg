[defaults]
inventory = ./K8s-inventory, /k8s-kubeadm-r2/K8s-inventory, /k8s-kubeadm-ansible/K8s-inventory, /K8s-inventory
log_path = ~/ansible.log
host_key_checking = false
ANSIBLE_FORCE_COLOR = true
forks = 30
stdout_callback = yaml
roles_path = ./roles

[privilege_escalation]
become_method = sudo
become_user = root
