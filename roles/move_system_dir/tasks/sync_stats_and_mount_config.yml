# code: language=ansible
---
- name: "Make .rsync-filter file if needed"
  ansible.builtin.template:
    src: rsync-filter.j2
    dest: "{{ item.source }}/.rsync-filter"
  when: item.excludes is defined

# The copy runs on a live guest: journald, cloud-init, apt and containerd write
# into the source while rsync works, so comparing counts taken before and after
# the copy fails on entries the copy was never asked to carry. Instead the exact
# set of paths that existed before the copy is recorded, and only those are
# verified afterwards. An entry created later is not in the snapshot and cannot
# fail the check; an entry deleted later no longer exists in the source and is
# skipped; a path that was there before the copy, is still there, and did not
# arrive at the destination is a real shortfall and is reported by name.
- name: "Snapshot the source tree before the copy"
  ansible.builtin.shell: >
    cd {{ item.source }} &&
    find . -mindepth 1
    {% for excl in item.excludes | default([]) %} ! -path '.{{ excl }}*' {% endfor %}
    | sort > /tmp/move_system_dir-{{ item.dest | basename }}.src
  register: source_snapshot
  changed_when: false
  become: true

- name: "Remove lost+found directory from the destination dir if it is present"
  ansible.builtin.file:
    path: "{{ item.dest }}/lost+found"
    state: absent

- name: "Synchronize source and destination data"
  ansible.builtin.command:
    cmd: >
      rsync -aHAX --one-file-system --quiet --ignore-missing-args
      {% if item.excludes is defined %}{% for excl in item.excludes %}--exclude='{{ excl }}' {% endfor %}{% endif %}
      {{ item.source }}/ {{ item.dest }}/
  become: true

- name: "Ensure excluded mountpoint directories exist on destination"
  ansible.builtin.file:
    path: "{{ item.dest }}{{ exclude_item }}"
    state: directory
    mode: "0755"
  loop: "{{ item.excludes | default([]) }}"
  loop_control:
    loop_var: exclude_item
  when: item.excludes is defined
  become: true

- name: "List the snapshot paths that did not arrive at the destination"
  ansible.builtin.shell: |
    cd {{ item.dest }}
    find . -mindepth 1 | sort > /tmp/move_system_dir-{{ item.dest | basename }}.dst
    comm -23 /tmp/move_system_dir-{{ item.dest | basename }}.src \
             /tmp/move_system_dir-{{ item.dest | basename }}.dst |
      while read -r path; do
        [ -e "{{ item.source }}/$path" ] && echo "$path"
      done
  register: missing_paths
  changed_when: false
  become: true

- name: "Fail if a path that still exists in the source is missing at the destination"
  ansible.builtin.fail:
    msg: |
      CRITICAL: {{ missing_paths.stdout_lines | length }} path(s) exist in {{ item.source }} and are missing at {{ item.dest }}:
      {{ missing_paths.stdout_lines | join('\n') }}
  when: missing_paths.stdout_lines | length > 0

- name: "Copy result"
  ansible.builtin.debug:
    msg: "{{ source_snapshot.stdout_lines | length }} path(s) from the snapshot are present at {{ item.dest }}."
  when: missing_paths.stdout_lines | length == 0

- name: "Remove the snapshot lists"
  ansible.builtin.file:
    path: "/tmp/move_system_dir-{{ item.dest | basename }}.{{ suffix }}"
    state: absent
  loop: [src, dst]
  loop_control:
    loop_var: suffix

- name: "Collect ansible facts"
  ansible.builtin.setup:

- name: "Get current destination mount info"
  ansible.builtin.set_fact:
    current_mount_info: "{{ ansible_facts['mounts'] | selectattr('mount', '==', item.dest) | list }}"
    
- name: "Comment out specific /var and /var/lib mount lines in fstab"
  replace:
    path: /etc/fstab  # Укажите путь к вашему файлу
    regexp: '^(/dev/disk/by-id/dm-uuid-LVM-[^\s]+\s+(/var|/var/lib)\s+ext4\s+defaults\s+0\s+1)$'
    replace: '# \1'


- name: "Remove current destination mount from /etc/fstab"
  ansible.builtin.lineinfile:
    path: /etc/fstab
    state: absent
    regexp: "{{ item.dest }}"

- name: "Make the new mount point for the system directory"
  ansible.builtin.lineinfile:
    path: /etc/fstab
    state: present
    line: "UUID={{ current_mount_info[0].uuid }} {{ item.source }} {{ current_mount_info[0].fstype }} defaults 0 2"
