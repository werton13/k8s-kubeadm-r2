---
- name: "Create directory for etcd downloads"
  file:
    path: "/home/{{ os_admin_username }}/k8s_bootstrap"
    state: directory
    owner: "{{ os_admin_username }}"
    group: "{{ os_admin_username }}"
    mode: '0755'

- name: "Download etcd release from public GitHub releases"
  ansible.builtin.get_url:
    url: "{{ ETCD_RELEASES_URL | default('https://github.com/etcd-io/etcd/releases/download') }}/{{ etcd_ver | default('v3.5.15') }}/etcd-{{ etcd_ver | default('v3.5.15') }}-linux-amd64.tar.gz"
    dest: "/home/{{ os_admin_username }}/k8s_bootstrap/etcd-{{ etcd_ver | default('v3.5.15') }}-linux-amd64.tar.gz"
    mode: '0644'
  tags: etcd_download

- name: "Unpack etcd binaries"
  unarchive:
    src: "/home/{{ os_admin_username }}/k8s_bootstrap/etcd-{{ etcd_ver | default('v3.5.15') }}-linux-amd64.tar.gz"
    dest: "/home/{{ os_admin_username }}/k8s_bootstrap/"
    remote_src: true
  tags: etcd_unpack

- name: "Install etcdctl into /usr/local/bin"
  ansible.builtin.copy:
    src: "/home/{{ os_admin_username }}/k8s_bootstrap/etcd-{{ etcd_ver | default('v3.5.15') }}-linux-amd64/etcdctl"
    dest: /usr/local/bin/etcdctl
    mode: '0755'
    remote_src: true
