---
- name: "Add Ingress NGINX Helm repo"
  kubernetes.core.helm_repository:
    name: ingress-nginx
    repo_url: "https://kubernetes.github.io/ingress-nginx"
  tags:
    - ingress-repo
    - ingress-controller

- name: "Deploy Ingress controller"
  kubernetes.core.helm:
    name: ingress-nginx
    chart_ref: ingress-nginx/ingress-nginx
    release_namespace: ingress-nginx
    create_namespace: true
    kubeconfig: "/etc/kubernetes/admin.conf"
    values:
      controller:
        replicaCount: 2
        metrics:
          enabled: true
          port: 10254
          portName: metrics
          service:
            enabled: true
        # with ingress_lb_ip (kube-vip, NSX-T without an Edge LB) the service gets that VIP,
        # otherwise the Edge LB forwards to the fixed NodePorts
        service:
          type: "{{ 'LoadBalancer' if (ingress_lb_ip | default('')) else 'NodePort' }}"
          annotations: "{{ {'kube-vip.io/loadbalancerIPs': ingress_lb_ip} if (ingress_lb_ip | default('')) else {} }}"
          nodePorts:
            http: "{{ ingress_controller_nodeport_http }}"
            https: "{{ ingress_controller_nodeport_https }}"
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/name
                        operator: In
                        values:
                          - ingress-nginx
                      - key: app.kubernetes.io/instance
                        operator: In
                        values:
                          - ingress-nginx
                      - key: app.kubernetes.io/component
                        operator: In
                        values:
                          - controller
                  topologyKey: kubernetes.io/hostname
  tags:
    - ingress-controller
