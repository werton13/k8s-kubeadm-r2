apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mts-developer
rules:
  # =============================================
  # Core resources (pods, services, configs, etc.)
  # =============================================
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - endpoints
      - persistentvolumeclaims
      - configmaps
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # =============================================
  # Workloads (deployments, statefulsets, etc.)
  # =============================================
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - replicasets
      - daemonsets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # =============================================
  # Batch jobs
  # =============================================
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # =============================================
  # Monitoring
  # =============================================
  - apiGroups: [""]
    resources:
      - events
    verbs:
      - get
      - list
      - watch

  # =============================================
  # Networking (Ingress)
  # =============================================
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch