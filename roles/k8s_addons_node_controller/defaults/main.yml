---
# Defaults mirror the Terraform `node_controller` variable. Terraform passes
# all of these explicitly in vars/cluster_vars.yaml; the defaults keep the role
# usable standalone and document the contract.
node_controller_enabled: false
node_controller_acknowledge_terraform_ownership_loss: false

node_controller_namespace: "vcd-nodescale-system"
node_controller_release_name: "vcd-nodescale"
node_controller_chart_repo: "https://k8s-nodescale.github.io/vcd-k8s-node-controller"
node_controller_chart_repo_name: "vcd-k8s-node-controller"
node_controller_chart_name: "vcd-nodescale"
node_controller_chart_version: "0.11.10"
node_controller_chart_ref: >-
  {{
    (node_controller_chart_repo.startswith('oci://')
     and node_controller_chart_repo)
    or (node_controller_chart_repo_name ~ '/' ~ node_controller_chart_name)
  }}

node_controller_image_repository: >-
  docker.io/werton13/vcd-k8s-node-controller
node_controller_image_tag: "0.11.10"
node_controller_image_pull_policy: "IfNotPresent"

node_controller_create_namespace: true
node_controller_create_vcd_secret: true
node_controller_vcd_secret_name: "vcd-credentials"
node_controller_vcd_user: ""
node_controller_vcd_password: ""
# Terraform passes vcloud_url as the full vCD API URL
# (e.g. https://iaas.cloud.mts.ru/api). Accept the bare FQDN too.
node_controller_vcd_base: >-
  {{
    (vcloud_url if (vcloud_url.startswith('http://') or vcloud_url.startswith('https://'))
     else 'https://' ~ vcloud_url)
    | regex_replace('/+$', '')
  }}
node_controller_vcd_url: >-
  {{
    node_controller_vcd_base
    if node_controller_vcd_base.endswith('/api')
    else node_controller_vcd_base ~ '/api'
  }}
node_controller_vcd_insecure: true

node_controller_helm_timeout: "10m"
node_controller_helm_atomic: true

# Placement. Control plane is the default: the pool must be able to reach zero,
# and the last-worker guard refuses to delete the worker the controller runs on
# (WorkerHostsController). dns_policy stays empty (cluster DNS) unless CoreDNS
# cannot run on a master.
node_controller_replica_count: 1
node_controller_node_selector:
  node-role.kubernetes.io/control-plane: ""
node_controller_tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
node_controller_affinity: {}
node_controller_priority_class_name: "system-cluster-critical"
node_controller_dns_policy: ""

# Rendered values file handed to Helm (keeps YAML types instead of strings).
node_controller_values_file: "/tmp/node_controller_values.yaml"

# Optional management UI (chart value ui.*): a page and a small API over the
# same CRD. Off by default. When it is on, the two default accounts are
# generated here, on the control host, and the Secret is created once - a
# manual password rotation must survive a re-run of this playbook.
node_controller_ui_enabled: false
node_controller_ui_ingress_enabled: true
node_controller_ui_auth_enabled: true
node_controller_ui_auth_secret_name: "nodescale-ui-auth"
node_controller_ui_admin_username: "admin"
node_controller_ui_viewer_username: "viewer"
# Passwords are written here, mode 0600, and never leave the control host.
node_controller_ui_credentials_dir: "{{ playbook_dir | default('.') }}/.credentials"
