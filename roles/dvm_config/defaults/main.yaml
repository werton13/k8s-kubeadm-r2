---
k8s_version_minor: "{{ (k8s_version_short | default('1.35.0')).split('.')[0] }}.{{ (k8s_version_short | default('1.35.0')).split('.')[1] }}"
gpg_key_url: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_version_minor }}/deb/Release.key"
apt_repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/v{{ k8s_version_minor }}/deb/ /"
