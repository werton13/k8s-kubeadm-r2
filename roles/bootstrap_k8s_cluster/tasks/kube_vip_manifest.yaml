---
  # kube-vip static pod: control-plane VIP (k8s_controlPlane_Endpoint) and LoadBalancer services (ARP mode).
  # Used where the cloud Edge has no load balancer (NSX-T without ALB).
  # The manifest is generated by kube-vip itself, so its flags always match the image version.
  # Kubernetes 1.29+: admin.conf gets cluster-admin only after 'kubeadm init' finishes,
  # so on the init node kube-vip must start with super-admin.conf and is switched to admin.conf afterwards.
  # vars: kube_vip_host - node to place the manifest on, kube_vip_kubeconfig - admin.conf or super-admin.conf
  - name: "STAGE_[ 5.kv of 18 ] --- pull kube-vip image on {{ kube_vip_host }}"
    ansible.builtin.command: ctr image pull ghcr.io/kube-vip/kube-vip:{{ kube_vip_version }}
    delegate_to: "{{ kube_vip_host }}"
    register: kube_vip_pull
    until: kube_vip_pull.rc == 0
    retries: 5
    delay: 10
    changed_when: false

  - name: "STAGE_[ 5.kv of 18 ] --- generate kube-vip manifest on {{ kube_vip_host }}"
    ansible.builtin.shell: |
      set -o pipefail
      mkdir -p /etc/kubernetes/manifests
      ctr run --rm --net-host ghcr.io/kube-vip/kube-vip:{{ kube_vip_version }} kube-vip-gen \
        /kube-vip manifest pod \
          --interface {{ os_nic1_name }} \
          --address {{ kube_vip_address }} \
          --controlplane \
          --services \
          --arp \
          --leaderElection \
        | sed 's#path: /etc/kubernetes/admin.conf#path: {{ kube_vip_kubeconfig }}#' \
        > /etc/kubernetes/manifests/kube-vip.yaml
      grep -q 'path: {{ kube_vip_kubeconfig }}' /etc/kubernetes/manifests/kube-vip.yaml
    args:
      executable: /bin/bash
    delegate_to: "{{ kube_vip_host }}"
