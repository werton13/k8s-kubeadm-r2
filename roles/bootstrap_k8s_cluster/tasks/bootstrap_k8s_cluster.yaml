---
  # Protection against wiping a live cluster: this stage starts with `kubeadm reset` on all nodes,
  # so an accidental re-run would destroy etcd and every node. If the cluster is already initialized,
  # stop here unless a rebuild is requested explicitly with -e k8s_force_reset=true
  - name: "STAGE_[ 5.0 of 18 ] --- check if the cluster is already initialized"
    ansible.builtin.stat:
      path: /etc/kubernetes/admin.conf
    register: k8s_admin_conf

  - name: "STAGE_[ 5.0 of 18 ] --- stop if the cluster already exists"
    ansible.builtin.fail:
      msg: >-
        Kubernetes is already initialized on {{ inventory_hostname }} (/etc/kubernetes/admin.conf exists).
        Re-running this stage would run 'kubeadm reset' on ALL nodes and destroy the cluster.
        To rebuild the cluster intentionally, re-run with: -e k8s_force_reset=true
    when:
      - k8s_admin_conf.stat.exists
      - not (k8s_force_reset | default(false) | bool)

  # reset all cluster nodes, not only masters[0]: otherwise a re-run fails on join
  # (kubelet.conf already exists / port 10250 in use on the other nodes).
  # On clean nodes (first run) this is a no-op.
  - name: "STAGE_[ 5.1 of 18 ] --- kubeadm reset"
    shell: kubeadm reset -f
    ignore_errors: true
    delegate_to: "{{ item }}"
    loop: "{{ groups.masters + groups.workers }}"

  - name: "copy oidc CA file"
    copy:
      src: kc-ca.pem
      dest: /etc/kubernetes/pki/kc-ca.pem
    when: "'mst' in inventory_hostname and (oidc_enabled | default(false) | bool)"

  # remove only the content of /etc/cni/net.d: containerd 2.x watches this directory
  # and exits if the directory itself is deleted (kubeadm init then fails on CRI preflight)
  - name: "STAGE_[ 5.2 of 18 ] --- clean kubeadm artifacts"
    ansible.builtin.shell: rm -rf /etc/cni/net.d/* /etc/kubernetes/tmp
    delegate_to: "{{ item }}"
    loop: "{{ groups.masters + groups.workers }}"

  - name: "STAGE_[ 5.2 of 18 ] --- wait for containerd CRI to respond on all nodes"
    ansible.builtin.command: crictl --runtime-endpoint unix:///run/containerd/containerd.sock info
    delegate_to: "{{ item }}"
    loop: "{{ groups.masters + groups.workers }}"
    register: crictl_info
    until: crictl_info.rc == 0
    retries: 12
    delay: 5
    changed_when: false

  - name: "STAGE_[ 5.3 of 18 ] --- copy kubeadm init config"
    template:
      src: ./templates/cluster_init_config_{{ k8s_version[1:] }}.yaml.j2
      dest: /home/{{ os_admin_username }}/cluster_init_config_{{ k8s_version[1:] }}.yaml
      mode: 0644

  - name: "STAGE_[ 5.4 of 18 ] --- kubernetes cluster bootstrap"
    shell: |
      kubeadm init --config "/home/{{ os_admin_username }}/cluster_init_config_{{ k8s_version[1:] }}.yaml" --upload-certs
    # no retries: after a partial init a retry only fails on preflight
    # ("manifests already exist") and hides the real error of the first attempt
    register: kubeadm_init_out

  - name: "STAGE_[ 5.5 of 18 ] --- generate worker join command"
    command: kubeadm token create --print-join-command
    register: kubeadm_worker_join_raw

  - name: "STAGE_[ 5.6 of 18 ] --- extract worker join command"
    set_fact:
      worker_join_cmd: "{{ kubeadm_worker_join_raw.stdout | trim }}"

  - name: "STAGE_[ 5.7 of 18 ] --- upload certificates for control-plane join"
    command: kubeadm init phase upload-certs --upload-certs
    register: upload_certs_out

  - name: "STAGE_[ 5.8 of 18 ] --- extract certificate key"
    set_fact:
      cert_key: "{{ upload_certs_out.stdout_lines[-1] | trim }}"

  - name: "STAGE_[ 5.9 of 18 ] --- construct control plane join command"
    set_fact:
      cp_join_cmd: "{{ worker_join_cmd }} --control-plane --certificate-key {{ cert_key }}"

  - name: "STAGE_[ 5.10 of 18 ] --- show join commands"
    debug:
      msg:
        - "Worker join command: {{ worker_join_cmd }}"
        - "Control-plane join command: {{ cp_join_cmd }}"

  - name: "STAGE_[ 5.11 of 18 ] --- join additional master nodes"
    shell: "{{ cp_join_cmd }}"
    delegate_to: "{{ item }}"
    loop: "{{ groups.masters[1:] }}"
    when: (groups.masters | length) > 1
    tags: join_second_master

  - name: "STAGE_[ 5.12 of 18 ] --- join workers nodes"
    shell: "{{ worker_join_cmd }}"
    delegate_to: "{{ item }}"
    loop: "{{ groups.workers }}"
    when: (groups.workers | length) > 0
    tags: join_workers

  - name: "STAGE_[ 5.13 of 18 ] --- label worker nodes with node-role.kubernetes.io/worker"
    shell: >
      kubectl --kubeconfig=/etc/kubernetes/admin.conf
      label node --selector='!node-role.kubernetes.io/control-plane'
      node-role.kubernetes.io/worker="" --overwrite
    ignore_errors: true
